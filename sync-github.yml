name: Sync GitHub data

on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 03:00 JST
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [main]
    paths: ["projects.json", "scripts/sync-github.mjs"]

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch repository data
        env:
          # 公開リポジトリだけなら GITHUB_TOKEN で足ります。
          # private や他アカウントも含めるなら、read 権限の PAT を
          # Settings → Secrets → Actions に GH_TOKEN として登録してください。
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: node scripts/sync-github.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git diff --staged --quiet || git commit -m "chore: sync GitHub data"
          git push
