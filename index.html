<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>Ryuta Suzuki — Projects</title>
<meta name="description" content="鈴木竜太が個人で開発しているプロジェクトの一覧。">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="./assets/hero-motion.js?v=3" defer></script>
<script src="./assets/page-motion.js" defer></script>
<style>
:root{
  --ink:#356E69; --acid:#F3D69B; --paper:#FAF8F3; --black:#303632;
  --mint:#E1ECE5; --line:#CFD9D0;
  --bg:var(--paper); --fg:var(--black); --accent:var(--ink);
  --display:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --pad:clamp(16px,3.4vw,40px);
  --content:1600px; --gutter:max(var(--pad),calc((100% - var(--content))/2)); --nav-height:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:calc(var(--nav-height) + 20px); scrollbar-gutter:stable}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body);
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
  transition:background .7s cubic-bezier(.16,1,.3,1), color .7s cubic-bezier(.16,1,.3,1)}
body.light{--bg:#F1F5EF}
body.locked{position:fixed; width:100%; overflow:hidden}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a,button{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button:active,a:active{opacity:.75}
::selection{background:var(--acid); color:var(--black)}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

#cur{position:fixed; top:0; left:0; width:12px; height:12px; border-radius:50%; background:var(--ink);
  z-index:900; pointer-events:none; opacity:.35; transform:translate(-50%,-50%);
  transition:width .28s,height .28s}
#cur.big{width:36px; height:36px}
@media (hover:none),(pointer:coarse){#cur{display:none}}

/* nav */
nav{position:fixed; top:0; left:0; right:0; z-index:300; display:flex; align-items:center; gap:18px;
  min-height:64px; padding:8px var(--gutter); font-family:var(--display); font-size:11.5px; font-weight:500; line-height:1.4;
  background:var(--paper); color:var(--black); border-bottom:1px solid var(--line)}
nav .sp{margin-left:auto}
.navlinks{display:contents}
nav a,nav button{display:inline-flex; align-items:center; justify-content:center; min-height:44px;
  opacity:.9; transition:opacity .2s}
nav a:hover,nav button:hover,nav a:focus-visible,nav button:focus-visible{opacity:1}
.lang{display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden}
.lang button{padding:0 10px; font-size:10.5px; opacity:.9; border-radius:0}
.lang button.on{background:var(--mint); color:var(--ink); opacity:1}
nav .k{border:1px solid var(--line); border-radius:99px; padding:3px 10px}
@media (max-width:760px){
  :root{--nav-height:106px}
  nav{display:grid; grid-template-columns:1fr auto auto; gap:2px 8px;
    padding:calc(6px + env(safe-area-inset-top)) var(--pad) 6px}
  #navName{font-size:clamp(9px,2.7vw,11.5px); white-space:nowrap}
  nav .lang{grid-column:2; grid-row:1}
  nav .lang button{min-width:44px; min-height:44px; padding:0 8px}
  nav .k{grid-column:3; grid-row:1; min-height:44px; padding:0 10px}
  .navlinks{grid-column:1/-1; grid-row:2; display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
  .navlinks a{display:flex; align-items:center; justify-content:center; min-height:44px;
    margin:0; border-radius:8px; font-size:10px}
  .navlinks a[href^="#"]{background:var(--mint); color:var(--ink)}
}
@media (max-width:420px){
  nav .k{font-size:10px; padding:0 8px}
}

/* hero */
header{display:flex; flex-direction:column; gap:16px;
  padding:calc(var(--nav-height) + 20px) var(--gutter) 20px; position:relative; isolation:isolate;
  background:var(--paper)}
.hero-visual{position:relative; isolation:isolate; aspect-ratio:1; display:grid; place-items:center; background:var(--paper)}
.hero-art{position:absolute; inset:0; z-index:-1; pointer-events:none}
.hero-art canvas{display:block; width:100%; height:100%}
.hero-footer{display:flex; align-items:center; gap:16px; width:100%; max-width:var(--content); margin:0 auto}
.hero-motion-toggle{padding:8px 12px;
  border:1px solid var(--line); border-radius:99px; background:var(--paper); color:var(--ink);
  font-size:11px; line-height:1.4; min-height:36px}
.hero-motion-toggle:hover{background:var(--mint)}
.hero-motion-toggle[hidden]{display:none}
@media (pointer:coarse){.hero-motion-toggle{min-height:44px}}
.hero-layout{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
  align-items:center; gap:clamp(24px,4vw,64px); width:100%; max-width:1600px; margin:0 auto}
.hero-copy{min-width:0; container-type:inline-size}
.hero-portrait{width:min(100%,600px); margin:0; justify-self:center}
.hero-portrait img{display:block; width:86%; height:auto; mix-blend-mode:multiply}
.meta{display:flex; flex-wrap:wrap; gap:8px 24px; font-family:var(--display); font-size:11px;
  font-weight:300; opacity:.72; margin-bottom:28px}
.kin{font-family:var(--display); font-weight:800; line-height:.98; letter-spacing:-.055em;
  font-size:clamp(40px,18cqw,146px); margin:0}
.kin .row{display:block}
.kin .l{display:inline-block; transition:transform .45s cubic-bezier(.16,1,.3,1)}
.kin .r2{color:var(--accent)}
.sub{max-width:52ch; margin:38px 0 0; font-size:15.5px; line-height:1.92; opacity:.88}
.scrolltip{margin-left:auto; font-family:var(--display); font-size:11px; opacity:.55}
.hero-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.hero-actions a{display:flex; align-items:center; justify-content:center; min-height:44px;
  padding:10px 16px; border:1px solid var(--line); border-radius:99px; font-size:12px; font-weight:700}
.hero-actions a:first-child{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.touch-hint{display:none}
.touch-hint[hidden]{display:none}
@media (min-width:761px) and (max-width:1100px){
  .meta{gap:8px 16px; font-size:9px; line-height:1.7; margin-bottom:22px}
  .sub{font-size:14px; margin-top:24px}
}
@media (min-width:761px) and (max-height:600px){
  .hero-layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .hero-portrait{width:min(100%,320px)}
  .kin{font-size:clamp(40px,15cqw,100px)}
  .sub{margin-top:20px; font-size:14px}
  .meta{margin-bottom:16px}
}

/* marquee */
.marq{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:13px 0;
  background:var(--mint);
  overflow:hidden; white-space:nowrap}
.marq-inner{max-width:var(--content); margin:0 auto; overflow:hidden}
.track{display:inline-block; font-family:var(--display); font-weight:300;
  font-size:clamp(21px,4vw,44px); letter-spacing:-.025em; will-change:transform}
.track span{padding:0 24px}
.track em{font-style:normal; color:var(--accent); font-weight:800}

/* pulse */
.sites{padding:clamp(44px,6vw,80px) var(--gutter); border-bottom:1px solid var(--line); background:var(--paper)}
.site-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
.site-fbtn{min-height:44px; padding:10px 16px; border:1px solid var(--line); border-radius:99px; font-size:12px}
.site-fbtn.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.site-fbtn:disabled{opacity:.5; cursor:default}
.launch-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.launch-card{display:flex; flex-direction:column; min-width:0; padding:20px; background:#fff;
  border:1px solid var(--line); border-radius:18px; transition:border-color .2s,background .2s}
.launch-card:hover,.launch-card:focus-visible{border-color:var(--ink); background:var(--mint)}
.launch-card img{width:100%; height:156px; object-fit:contain; mix-blend-mode:multiply}
.launch-card h3{font-family:var(--display); margin:14px 0 8px; font-size:clamp(18px,1.6vw,24px); overflow-wrap:anywhere}
.launch-card p{font-size:13px; line-height:1.75; margin:0 0 18px; flex:1}
.launch-action{display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:14px;
  border-top:1px solid var(--line); font-size:13px; font-weight:700}
.launch-action small{font-size:10px; font-weight:400}
.site-empty{font-size:13px; line-height:1.8; margin:0}
@media (max-width:1000px){.launch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.launch-grid{grid-template-columns:minmax(0,1fr)}}
.pulse{padding:clamp(46px,7vw,86px) var(--gutter) clamp(40px,6vw,70px); border-bottom:1px solid var(--line)}
.pulse-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:24px}
.pulse-head h2{font-family:var(--display); font-weight:500; font-size:clamp(20px,2.6vw,30px);
  letter-spacing:-.04em; margin:0}
.badge{font-family:var(--display); font-size:9.5px; border:1px solid currentColor; border-radius:99px;
  padding:3px 9px; opacity:.7}
.badge.live{background:var(--mint); color:var(--ink); border-color:var(--line); opacity:1}
.badge.stale{background:var(--acid); color:var(--ink); opacity:1}
.sync-info,.activity-note{font-size:12px; line-height:1.8; margin:0 0 18px; color:var(--ink)}
.activity-note{margin:12px 0 0; opacity:.75}
.pulse-head .sum{font-size:12px; opacity:.66; margin-left:auto; font-variant-numeric:tabular-nums}
.section-art{display:block; width:240px; max-width:100%; height:auto; object-fit:contain; mix-blend-mode:multiply}
.pulse-intro{display:flex; align-items:center; gap:32px; margin-bottom:24px}
.pulse-intro .pulse-head{flex:1; min-width:0; margin-bottom:0}
.pulse-intro .section-art{width:180px}
.heatwrap{overflow-x:auto; padding-bottom:10px}
.heat{display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; gap:3px;
  min-width:660px; height:104px}
.heat i{border-radius:2px; background:var(--ink); opacity:.12}
.figs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:30px 22px; margin-top:40px}
.fig strong{display:block; font-family:var(--display); font-weight:800; font-size:clamp(40px,6.2vw,76px);
  letter-spacing:-.06em; line-height:.88; color:var(--accent); font-variant-numeric:tabular-nums}
.fig span{display:block; font-size:12.5px; opacity:.74; margin-top:11px; line-height:1.65}
.fig-languages{grid-column:1/-1; padding-top:24px; border-top:1px solid var(--line)}
.fig-languages h3{margin:0 0 12px; font-size:13px; font-weight:500}
.language-list{display:flex; flex-wrap:wrap; gap:8px}
.language-list i{font-style:normal; padding:7px 12px; border:1px solid var(--line); border-radius:99px;
  font-size:13px; background:var(--paper); overflow-wrap:anywhere}

/* work */
.work{padding:clamp(56px,8vw,96px) var(--gutter) 40px}
.sechead{display:flex; align-items:flex-end; gap:20px; margin-bottom:26px; flex-wrap:wrap}
.sechead h2{font-family:var(--display); font-weight:500; font-size:clamp(26px,4.2vw,46px);
  letter-spacing:-.045em; margin:0}
.sechead p{margin:0 0 7px auto; font-size:13px; opacity:.7; max-width:34ch}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; font-family:var(--display); font-size:11px}
.fbtn{border:1px solid var(--line); border-radius:99px; padding:6px 14px; opacity:.85; transition:.25s}
.fbtn:hover{opacity:1}
.fbtn.on{background:var(--mint); color:var(--ink); border-color:var(--ink); opacity:1}
.work-count{margin:0 0 18px; font-size:12px; color:var(--ink)}
.work-toolbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px}
.work-toolbar .work-count{margin:0}
.view-controls{display:flex; flex-wrap:wrap; gap:6px}
.viewbtn{min-height:44px; padding:9px 14px; border:1px solid var(--line); border-radius:12px; font-size:12px}
.viewbtn.on{background:var(--mint); color:var(--ink); border-color:var(--ink)}
.project-group{grid-column:span 2; min-width:0; padding:20px; border:2px solid var(--line); border-radius:12px;
  background:var(--mint); display:flex; flex-direction:column; gap:12px}
.project-group[hidden]{display:none}
.group-heading h3{font-family:var(--display); font-size:25px; line-height:1.16; overflow-wrap:anywhere; margin:0 0 8px}
.group-heading p{font-size:12.5px; line-height:1.68; margin:0}
.group-heading small{display:block; font-family:var(--body); font-size:11px; font-weight:400; margin-bottom:8px}
.group-art{display:block; width:100%; height:112px; object-fit:contain; mix-blend-mode:multiply}
.group-site{display:flex; align-items:center; justify-content:space-between; min-height:44px; padding:10px 12px; border-radius:10px;
  background:var(--ink); color:var(--paper); font-size:12px; font-weight:700; margin-top:auto}
.group-grid{display:grid; gap:6px}
@media (max-width:900px){.project-group{grid-column:span 1}}
@media (max-width:760px){.project-group{padding:16px; border-radius:18px}.group-heading h3{font-size:23px}}
.sort-control{display:flex; align-items:center; gap:10px; font-size:12px}
.sort-control select{max-width:100%; min-height:44px; padding:8px 32px 8px 12px; border:1px solid var(--line);
  border-radius:12px; background:var(--paper); color:var(--ink); font:inherit; cursor:pointer}
.sort-note{margin:0 0 18px; font-size:12px; line-height:1.7; opacity:.75}
.tile-languages{display:flex; flex-wrap:wrap; gap:5px; margin-top:12px; font-size:11px; line-height:1.5}
.tile-languages i{font-style:normal; background:var(--mint); border-radius:6px; padding:3px 7px; overflow-wrap:anywhere}
.filter-hint{display:none}

.bento{display:grid; gap:12px; grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{position:relative; overflow:hidden; border:2px solid var(--line); border-radius:12px;
  padding:20px; display:flex; flex-direction:column; min-width:0; min-height:250px;
  transition:background .42s cubic-bezier(.16,1,.3,1), color .42s, transform .42s cubic-bezier(.16,1,.3,1),
    opacity .3s}
.tile:hover,.tile:focus-within{background:var(--mint); color:var(--black); transform:translate(-5px,-5px)}
.tile[hidden]{display:none}
.tile-more{display:flex; align-items:center; justify-content:space-between; gap:8px;
  color:var(--ink); margin-top:16px; font-size:12px; font-weight:700}
.tile-more b{display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; width:28px; height:28px}
.tile-open{position:absolute; inset:0; z-index:1}
.tile>:where(:not(.tile-open):not(.site):not(.tile-art)){position:relative; z-index:0; pointer-events:none}
.tile .no{font-family:var(--display); font-weight:300; font-size:10.5px; line-height:1.55;
  padding-right:142px; opacity:.75; overflow-wrap:anywhere}
.tile h3{font-family:var(--display); font-weight:500; letter-spacing:-.04em; margin:auto 0 9px;
  font-size:clamp(20px,2.3vw,33px); line-height:1.16; overflow-wrap:anywhere}
.tile .jp{font-size:12.5px; opacity:.8; line-height:1.68; margin:0}
.tile .st{position:static; align-self:flex-start; max-width:100%; margin:12px 0 24px;
  font-family:var(--display); font-size:10px; line-height:1.4;
  border:1px solid transparent; border-radius:99px; padding:3px 10px; background:var(--acid); color:var(--black);
  z-index:0; pointer-events:none}
.tile:hover .st,.tile:focus-within .st{border-color:currentColor}
.tile .site{position:absolute; top:14px; right:14px; z-index:3; display:flex; align-items:center; gap:10px;
  min-height:44px; max-width:132px; font-size:12px; font-weight:700; line-height:1.4;
  border:1px solid var(--ink); border-radius:12px; padding:10px 14px; background:var(--ink); color:var(--paper);
  transition:background .2s}
.tile .site:hover{background:var(--accent); color:var(--paper)}
.tile .foot{display:flex; align-items:flex-end; gap:14px; margin-top:16px;
  padding-top:13px; border-top:1px solid currentColor}
.tile .foot .lbl{font-family:var(--display); font-size:10px; opacity:.62; line-height:1.5; white-space:nowrap}
.tile .foot .lbl b{display:block; font-weight:500; font-size:13px; opacity:1; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.sparkbar{display:flex; gap:2px; align-items:flex-end; height:30px; flex:1; margin-left:auto; max-width:132px}
.sparkbar i{flex:1; background:currentColor; opacity:.45; border-radius:1px}
.tile.has-image{isolation:isolate; background:#fff; color:var(--black);
  border-color:var(--line)}
.tile .tile-art{display:block; width:100%; height:168px; flex:none; margin:0 0 18px;
  object-fit:contain; pointer-events:none; mix-blend-mode:multiply;
  transition:transform .45s cubic-bezier(.16,1,.3,1)}
.tile .tile-art[hidden]{display:none}
.tile.has-image:hover,.tile.has-image:focus-within{background:#fff; border-color:var(--ink)}
.tile.has-image:hover .tile-art,.tile.has-image:focus-within .tile-art{transform:translateY(-4px)}
.tile.has-image .st{margin-bottom:6px}
.tile .site[data-kind="guide"],.tile .site[data-kind="page"]{background:var(--mint); color:var(--ink)}
.tile .site[data-kind="guide"]:hover,.tile .site[data-kind="page"]:hover{background:var(--ink); color:var(--paper)}
.tile.has-image .foot{border-color:var(--line)}
.tile.has-image .foot .lbl{opacity:.75}
@media (prefers-reduced-motion:reduce){.tile .tile-art{transition:none}}
.s-hero{grid-column:span 4; min-height:336px}
.s-tall{grid-column:span 2; min-height:336px}
.s-wide{grid-column:span 3}
.s-std{grid-column:span 2}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .s-hero,.s-wide{grid-column:span 2; min-height:206px}
  .s-tall,.s-std{grid-column:span 1; min-height:206px}
  .tile.s-tall .tile-art{height:220px}}
@media (max-width:520px){.bento{grid-template-columns:1fr}
  .s-hero,.s-tall,.s-wide,.s-std{grid-column:span 1}
  .tile.has-image .tile-art{height:180px}}
.group-grid>.group-member{grid-column:auto; flex-direction:row; align-items:center; gap:8px; min-height:48px;
  padding:4px 0 4px 12px; border-width:1px; border-radius:10px; background:var(--paper)}
.group-member:hover,.group-member:focus-within{transform:none; border-color:var(--ink)}
.group-member h4{min-width:0; flex:1; font-size:12px; line-height:1.5; overflow-wrap:anywhere; margin:0}
.group-grid .group-member .site{position:relative; inset:auto; flex:none; justify-content:center; width:44px; min-height:44px;
  padding:8px; border:0; border-radius:8px; background:transparent; color:var(--ink)}

/* about */
.about{padding:clamp(70px,10vw,124px) var(--gutter); margin-top:78px; border-top:1px solid var(--line);
  background:var(--mint)}
.about-intro{display:flex; align-items:center; justify-content:space-between; gap:40px; margin-bottom:46px}
.about blockquote{margin:0; max-width:22ch; font-family:var(--display); font-weight:300;
  font-size:clamp(28px,5vw,58px); line-height:1.06; letter-spacing:-.05em}
.about-intro .section-art{flex:none}
.abody{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:34px}
.abody p{margin:0; font-size:14px; line-height:2; opacity:.86; max-width:46ch}
.skills{display:flex; flex-wrap:wrap; gap:7px; align-content:flex-start;
  font-family:var(--display); font-size:11px; font-weight:300}
.skills i{font-style:normal; border:1px solid var(--line); border-radius:99px; padding:4px 11px;
  background:var(--paper); color:var(--ink)}

footer{padding:66px var(--gutter) 26px; border-top:1px solid var(--line); background:#fff}
.footer-intro{display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:32px}
.footer-intro .section-art{width:clamp(80px,28vw,340px); flex:none}
.fbig{font-family:var(--display); font-weight:800; font-size:clamp(44px,9vw,146px); line-height:.82;
  letter-spacing:-.065em; margin:0}
.frow{display:flex; flex-wrap:wrap; gap:14px 28px; font-family:var(--display); font-size:11.5px;
  font-weight:300; opacity:.72}
.frow a{border-bottom:1px solid transparent; transition:border-color .2s}
.frow a:hover,.frow a:focus-visible{border-color:var(--accent)}
.note{margin-top:20px; font-size:10.5px; opacity:.45; font-family:var(--display); font-weight:300}
@media (max-width:700px){
  .pulse-intro{flex-wrap:wrap; gap:16px}
  .pulse-intro .pulse-head{flex-basis:100%}
  .pulse-intro .section-art{width:132px; margin-left:auto}

    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'})
      .formatToParts(new Date(timestamp));
    const value=Object.fromEntries(parts.map(part=>[part.type,part.value]));
    return `${value.year}-${value.month}-${value.day} JST`;
  }
  return /^\d{4}-\d{2}-\d{2}$/.test(g.pushed||'')?`${g.pushed} UTC`:'—';

function websiteEntries(){
  const seen=new Set();
  return DATA.projects.flatMap((p,i)=>{
    const href=webUrl(p.g?.site);
    if(!href||p.showcase===false)return [];
    const key=new URL(href); key.hash=''; key.pathname=key.pathname.replace(/\/+$/,'')||'/';
    if(seen.has(key.href))return [];
    seen.add(key.href);
    return [{p,i,href,group:(DATA.groups||[]).find(group=>group.id===p.group)}];
  });
}
function projectLanguages(project){
  const g=project.g||{};
  if(g.languages&&typeof g.languages==='object')return Object.entries(g.languages)
    .filter(([,bytes])=>Number.isFinite(bytes)&&bytes>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([name])=>name);
  return g.language?[g.language]:[];
}
function projectBuckets(entries){
  const groups=new Map((DATA.groups||[]).map(group=>[group.id,group]));
  const seen=new Set(),buckets=[];
  for(const entry of entries){
    const group=VIEW==='groups'?groups.get(entry.p.group):null;
    if(!group){buckets.push({group:null,entries:[entry]});continue}
    if(seen.has(group.id))continue;
    seen.add(group.id);
    buckets.push({group,entries:entries.filter(item=>item.p.group===group.id)});
  }
  if(VIEW==='groups'&&FILTER!=='all'){
    const positions=new Map(entries.map((entry,index)=>[entry.i,index]));
    const rank=bucket=>positions.get((bucket.entries.find(({p})=>p.filter===FILTER)||bucket.entries[0]).i);
    buckets.sort((a,b)=>rank(a)-rank(b));
  }
  return buckets;
}
function projectOrder(){
  const entries=DATA.projects.map((p,i)=>({p,i}));
  const metric=p=>SORT==='popular'?p.g.stars:SORT==='commits'?p.g.commits:Date.parse(p.g.pushedAt||p.g.pushed);
  if(SORT!=='recommended')entries.sort((a,b)=>{
    const av=metric(a.p),bv=metric(b.p),ak=Number.isFinite(av),bk=Number.isFinite(bv);
    return Number(bk)-Number(ak)||(ak&&bk?bv-av:0)
      ||(SORT==='popular'?(b.p.g.forks||0)-(a.p.g.forks||0):0)||a.i-b.i;
  });
  return projectBuckets(entries).flatMap(bucket=>bucket.entries);
}

/* ===================== data loading ===================== */
async function loadGithub(){
  /* 1) build-time file written by GitHub Actions */
  try{
    const r=await fetch('./data/github.json',{cache:'no-cache',signal:AbortSignal.timeout(10000)});
    if(r.ok){
      const j=await r.json();
      if(j.owner===DATA.profile.github&&Array.isArray(j.projects)&&j.projects.length&&j.stats){
        DATA.projects=j.projects; LIVE=true; SOURCE='snapshot'; SYNCED_AT=j.syncedAt||''; return j.stats;
      }
    }
  }catch(e){}
  /* 2) live API (works on your own domain; blocked in sandboxed previews) */
  try{
    const login=DATA.profile.github;
    const repos=[];
    for(let page=1;;page++){
      const res=await fetch(`https://api.github.com/users/${encodeURIComponent(login)}/repos?type=owner&per_page=100&sort=pushed&direction=desc&page=${page}`,{signal:AbortSignal.timeout(10000)});
      if(!res.ok) throw new Error('Repository list unavailable');
      const batch=await res.json();
      if(!Array.isArray(batch)) throw new Error('Invalid repository list');
      repos.push(...batch.filter(r=>r.private===false&&r.owner?.login.toLowerCase()===login.toLowerCase()));
      if(batch.length<100)break;
    }
    if(!repos.length)return null;
    const known=new Map(DATA.projects.map((p,index)=>[p.repo.toLowerCase(),{p,index}]));
    repos.sort((a,b)=>(known.get(a.full_name.toLowerCase())?.index??Infinity)-(known.get(b.full_name.toLowerCase())?.index??Infinity)||(b.pushed_at||'').localeCompare(a.pushed_at||''));
    const projects=repos.map(r=>{
      const p=known.get(r.full_name.toLowerCase())?.p;
      const description={ja:r.description||'GitHubで公開しているプロジェクト',en:r.description||'A public project on GitHub'};
      return {slug:r.name.toLowerCase(),repo:r.full_name,name:p?.name||r.name,size:p?.size||'std',filter:p?.filter||'other',
        year:(r.created_at||'').slice(0,4),tag:p?.tag||{ja:r.language||'GitHub',en:r.language||'GITHUB'},
        status:r.archived?{ja:'アーカイブ',en:'Archived'}:r.fork?{ja:'フォーク',en:'Fork'}:{ja:'公開',en:'Public'},
        summary:p?.summary||description,desc:p?.desc||description,stack:p?.stack||(r.language?[r.language]:[]),links:p?.links||{},image:p?.image||'',
        group:p?.group||'',siteKind:['app','guide','page'].includes(p?.siteKind)?p.siteKind:'page',showcase:p?.showcase!==false,fork:r.fork};
    });
    const out={};
    repos.forEach((r,index)=>{
      out[projects[index].slug]={weeks:[], stars:r.stargazers_count, forks:r.forks_count,
        language:r.language, languages:null, commits:null, license:r.license?.spdx_id||'—',
        pushed:(r.pushed_at||'').slice(0,10), pushedAt:r.pushed_at||'', url:r.html_url,
        site:webUrl(r.homepage)||(r.has_pages?`https://${login}.github.io/${r.name.toLowerCase()===`${login.toLowerCase()}.github.io`?'':`${r.name}/`}`:'')};
    });
    DATA.projects=projects; LIVE=true; SOURCE='api'; SYNCED_AT=new Date().toISOString(); return out;
  }catch(e){}
  return null;
}

async function boot(){
  try{
    const r=await fetch('./projects.json',{cache:'no-cache'});
    if(r.ok) DATA=await r.json();
  }catch(e){}
  const gh=await loadGithub();
  DATA.projects.forEach(p=>{
    const g=(gh&&gh[p.slug])||{weeks:[]};
    if(!g.weeks) g.weeks=[];
    p.g=g;
    p.g.commits=Number.isSafeInteger(g.commits)&&g.commits>=0?g.commits:null;
    p.g.annualCommits=g.weeks.length?g.weeks.reduce((s,w)=>s+(w.total||0),0):null;
    p.g.activeWeeks=g.weeks.length?g.weeks.filter(w=>(w.total||0)>0).length:null;
    p.g.bars=g.weeks.slice(-14).map(w=>w.total||0);
    p.g.site=webUrl(p.links?.site)||webUrl(g.site);
    p.g.url=webUrl(g.url)||(p.repo?`https://github.com/${p.repo}`:'');
  });
  try{
    const s=localStorage.getItem('lang'); if(['ja','en'].includes(s))LANG=s;
    const sort=localStorage.getItem('project-sort'); if(SORT_KEYS.includes(sort))SORT=sort;
    const view=localStorage.getItem('project-view'); if(['groups','repos'].includes(view))VIEW=view;
  }
  catch(e){}
  if(!localStorageLang()&&navigator.language&&!navigator.language.startsWith('ja')) LANG='en';
  render();
  startMotion();
}
function localStorageLang(){try{return localStorage.getItem('lang')}catch(e){return null}}

function render(){
  const P=DATA.projects, pr=DATA.profile;
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));

  $('navName').textContent=pr.name.toUpperCase();

  const syncTime=Date.parse(SYNCED_AT), stale=SOURCE==='snapshot'&&(!Number.isFinite(syncTime)||Date.now()-syncTime>36*60*60*1000);
  const sourceLabel=LIVE?t(stale?'sync.stale':'liveSrc'):t('demo');
  $('heroMeta').innerHTML=[tx(pr.location).toUpperCase(),tx(pr.role).toUpperCase(),
    `${P.length} PUBLIC PROJECTS`,sourceLabel].map(s=>`<span>${esc(s)}</span>`).join('');
  $('kin').innerHTML=pr.hero.map((r,i)=>
    `<span class="row r${i+1}">${[...r].map(c=>`<span class="l">${c}</span>`).join('')}</span>`).join('');
  $('heroSub').textContent=tx(pr.intro);
  $('aboutQuote').textContent=tx(pr.quote);
  $('aboutBody').textContent=tx(pr.about);
  $('skills').innerHTML=pr.skills.map(s=>`<i>${s}</i>`).join('');
  $('frow').innerHTML=`<a href="${pr.links.github}" target="_blank" rel="noopener">GITHUB</a>
    <a href="${pr.links.linkedin}" target="_blank" rel="noopener">LINKEDIN</a>
    <a href="${pr.links.mail}">MAIL</a>
    <span style="margin-left:auto">© ${new Date().getFullYear()} ${pr.name} — ${tx(pr.location)}</span>`;
  $('footNote').textContent=LIVE?t('note'):t('noteDemo');

  /* marquee */
  const seg=P.map(p=>`<span>${esc(p.name)}</span><em>◆</em>`).join('');
  $('track').innerHTML=seg+seg+seg;

  /* pulse */
  const badge=$('srcBadge');
  badge.textContent=sourceLabel;
  badge.classList.toggle('live',LIVE&&!stale); badge.classList.toggle('stale',stale);
  $('syncInfo').textContent=LIVE?(Number.isFinite(syncTime)?`${t('sync.at')}: ${new Intl.DateTimeFormat(LANG==='ja'?'ja-JP':'en-GB',
    {dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Tokyo'}).format(syncTime)} JST · ${t(SOURCE==='api'?'sync.api':'sync.daily')}`:t('sync.unknown')):t('demo');
  const weekCount=Math.max(0,...P.map(p=>p.g.weeks.length))||52;
  const agg=Array.from({length:weekCount*7},(_,i)=>P.reduce((s,p)=>{
    const w=p.g.weeks[Math.floor(i/7)]; return s+((w&&w.days&&w.days[i%7])||0)},0));
  const max=Math.max(1,...agg);
  $('heat').innerHTML=agg.map(v=>`<i style="opacity:${(.1+(v/max)*.9).toFixed(2)}"></i>`).join('');
  const totC=P.some(p=>p.g.commits!==null)?P.reduce((s,p)=>s+(p.g.commits||0),0):null;
  const totS=P.some(p=>p.g.stars!==undefined)?P.reduce((s,p)=>s+(p.g.stars||0),0):null;
  const annual=P.some(p=>p.g.annualCommits!==null)?P.reduce((s,p)=>s+(p.g.annualCommits||0),0):null;
  $('pulseSum').textContent=`${annual?.toLocaleString()??'—'} commits / ${weekCount} weeks`;
  $('activityNote').textContent=`${t('activity.coverage')}: ${P.filter(p=>p.g.weeks.length).length} / ${P.length} · ${t('activity.scope')}`;
  const langs=[...new Set(P.flatMap(projectLanguages))].sort((a,b)=>a.localeCompare(b));
  const figs=[[P.length,0],[totC,1],[totS,2]];
  $('figs').innerHTML=figs.map(([n,i])=>
    `<div class="fig"><strong${n===null?'':` data-to="${n}"`}>${n===null?'—':'0'}</strong><span>${t('figs')[i]}</span></div>`).join('')
    +`<div class="fig-languages"><h3>${t('figs')[3]}</h3><div class="language-list">${langs.length?langs.map(name=>`<i>${esc(name)}</i>`).join(''):'—'}</div></div>`;
  countUp();
  renderSites();

  /* filters */
  const keys=['all',...new Set(P.map(p=>p.filter))];
  if(!keys.includes(FILTER))FILTER='all';
  $('filters').innerHTML=keys.map(k=>
    `<button class="fbtn ${k===FILTER?'on':''}" aria-pressed="${k===FILTER}" data-k="${esc(k)}">${esc(t(k))}</button>`).join('');

  renderTiles();
  if(curI>=0) fill(curI);
}
function renderSites(){
  const sites=websiteEntries();
  const counts={all:sites.length,app:sites.filter(({p})=>p.siteKind==='app').length};
  counts.other=counts.all-counts.app;
  if(!counts[SITE_FILTER])SITE_FILTER='all';
  $('siteTabs').innerHTML=['all','app','other'].map(key=>{
    const count=counts[key];
    return `<button class="site-fbtn ${SITE_FILTER===key?'on':''}" data-sites="${key}" aria-pressed="${SITE_FILTER===key}"${count?'':' disabled'}>${t('sites.'+key)} (${count})</button>`;
  }).join('');
  const visible=sites.filter(({p})=>SITE_FILTER==='all'||(p.siteKind==='app'?'app':'other')===SITE_FILTER);
  const groupCounts=new Map();
  sites.forEach(({group})=>{if(group)groupCounts.set(group.id,(groupCounts.get(group.id)||0)+1)});
  $('launchGrid').innerHTML=visible.length?visible.map(({p,href,group})=>{
    const shared=group&&groupCounts.get(group.id)===1?group:null;
    return `
    <a class="launch-card" href="${esc(href)}" target="_blank" rel="noopener"
      aria-label="${esc((shared?.name||p.name)+' — '+siteAction(p)+' ('+t('site.newTab')+')')}">
      ${artworkPath(p.image)?`<img src="${esc(p.image)}" alt="" aria-hidden="true" width="1280" height="853" loading="lazy" decoding="async">`:''}
      <h3>${esc(shared?.name||p.name)}</h3><p>${esc(tx(shared?.summary||p.summary))}</p>
      <span class="launch-action"><span>${siteAction(p)} ↗</span><small>${t('site.newTab')}</small></span>
    </a>`}).join(''):`<p class="site-empty">${t(sites.length?'sites.empty':'sites.unavailable')}</p>`;
}
function renderTiles(){
  $('projectViewControls').innerHTML=['groups','repos'].map(key=>`<button class="viewbtn ${VIEW===key?'on':''}"
    data-view="${key}" aria-pressed="${VIEW===key}">${t('view.'+key)}</button>`).join('');
  $('projectSort').innerHTML=SORT_KEYS.map(key=>`<option value="${key}"${key===SORT?' selected':''}>${t('sort.'+key)}</option>`).join('');
  $('sortNote').textContent=t('sort.note.'+SORT)+(VIEW==='groups'?' '+t('view.note.groups'):'');
  const ordered=projectOrder(),ranks=new Map(ordered.map(({i},rank)=>[i,rank]));
  const tile=({p,i})=>tileMarkup(p,i,ranks.get(i));
  $('bento').innerHTML=projectBuckets(ordered).map(({group,entries})=>{
    if(!group)return entries.map(tile).join('');
    const project=webUrl(group.projectUrl);
    const site=project||entries.map(({p})=>webUrl(p.g.site)).find(Boolean);
    const label=project?'GitHub Project':t('site.action.guide');
    const art=entries.map(({p})=>artworkPath(p.image)).find(Boolean);
    return `<section class="project-group" aria-labelledby="group-${esc(group.id)}">
      ${art?`<img class="group-art" src="${esc(art)}" alt="" aria-hidden="true" loading="lazy" decoding="async" width="1280" height="853">`:''}
      <div class="group-heading"><small>${entries.length} ${t('group.repositories')}</small>
        <h3 id="group-${esc(group.id)}">${esc(group.name)}</h3><p>${esc(tx(group.summary))}</p></div>
      <div class="group-grid">${entries.map(({p,i})=>`<article class="tile group-member" data-f="${esc(p.filter)}">
        <button class="tile-open" data-i="${i}" aria-label="${esc(p.name)}"></button><h4>${esc(p.name)}</h4>
        ${p.g.site?`<a class="site" href="${esc(p.g.site)}" target="_blank" rel="noopener"
          aria-label="${esc(p.name+' — '+siteAction(p)+' ('+t('site.newTab')+')')}"><span aria-hidden="true">↗</span></a>`:''}
      </article>`).join('')}</div>
        ${site?`<a class="group-site" href="${esc(site)}" target="_blank" rel="noopener"
          aria-label="${esc(group.name+' — '+label+' ('+t('site.newTab')+')')}">${label} ↗</a>`:''}</section>`;
  }).join('');
  applyFilter();
}
function tileMarkup(p,i,rank){
  return `
    <article class="tile s-std${artworkPath(p.image)?' has-image':''}" data-f="${esc(p.filter)}">
      <button class="tile-open" data-i="${i}" aria-label="${esc(p.name)}"></button>
      <span class="no">${String(rank+1).padStart(2,'0')} — ${esc(tx(p.tag))}</span>
      <span class="st">${esc(tx(p.status))}</span>
      ${p.g.site?`<a class="site" data-kind="${esc(p.siteKind||'page')}" href="${esc(p.g.site)}" target="_blank" rel="noopener"
        aria-label="${esc(p.name+' — '+siteAction(p)+' ('+t('site.newTab')+')')}"><span>${siteAction(p)}</span><b aria-hidden="true">↗</b></a>`:''}
      ${artworkPath(p.image)?`<img class="tile-art" src="${esc(p.image)}" alt="" aria-hidden="true" loading="lazy" decoding="async" width="1280" height="853">`:''}
      <h3>${esc(p.name)}</h3>
      <p class="jp">${esc(tx(p.summary))}</p>
      <span class="tile-languages">${projectLanguages(p).map(name=>`<i>${esc(name)}</i>`).join('')}</span>
      <span class="foot">
        <span class="lbl">${t('f.commits')}<b>${p.g.commits?.toLocaleString()??'—'}</b></span>
        <span class="lbl">${t('f.updated')}<b>${esc(updatedDisplay(p.g))}</b></span>
        <span class="sparkbar">${sparks(p.g.bars)}</span>
      </span>
      <span class="tile-more" aria-hidden="true">${t('work.details')}<b>↗</b></span>
    </article>`;
}
function applyFilter(){
  document.querySelectorAll('.fbtn').forEach(button=>{
    const selected=button.dataset.k===FILTER;
    button.classList.toggle('on',selected); button.setAttribute('aria-pressed',String(selected));
  });
  document.querySelectorAll('.tile').forEach(tile=>{tile.hidden=FILTER!=='all'&&tile.dataset.f!==FILTER});
  document.querySelectorAll('.project-group').forEach(group=>{group.hidden=![...group.querySelectorAll('.tile')].some(tile=>!tile.hidden)});
  const count=DATA.projects.filter(project=>FILTER==='all'||project.filter===FILTER).length;
  $('workCount').textContent=`${count} / ${DATA.projects.length} ${t('work.count')}`;
}
function sparks(bars){
  const m=Math.max(1,...bars);
  return bars.map(b=>`<i style="height:${Math.max(4,b/m*100)}%"></i>`).join('');
}
function countUp(){
  document.querySelectorAll('.fig strong[data-to]').forEach(el=>{
    const to=+el.dataset.to;
    if(motionPreference.matches){el.textContent=to.toLocaleString(); return}
    new IntersectionObserver((es,ob)=>es.forEach(en=>{
      if(!en.isIntersecting)return; ob.disconnect();
      const t0=performance.now();
      (function step(t){
        const k=motionPreference.matches?1:Math.min((t-t0)/1100,1), e=1-Math.pow(1-k,3);
        el.textContent=Math.round(to*e).toLocaleString();
        if(k<1)requestAnimationFrame(step);
      })(t0);
    }),{threshold:.5}).observe(el);
  });
}

/* ===================== sheet ===================== */
const sheet=$('sheet'); let curI=-1, lastFocus=null;
let pageScroll=null;
// Native restoration can overwrite the saved position after a fixed-body dialog closes.
history.scrollRestoration='manual';
function rememberPage(){history.replaceState({...history.state,pageY:pageScroll??scrollY},'')}
function lockPage(){
  if(pageScroll!==null)return;
  pageScroll=scrollY;
  document.body.style.top=`-${pageScroll}px`;
  document.body.classList.add('locked');
}
function unlockPage(){
  if(sheet.open||pal.open||pageScroll===null)return;
  const y=pageScroll; pageScroll=null;
  document.body.classList.remove('locked'); document.body.style.top='';
  scrollTo({top:y,behavior:'instant'});
}
function fill(i){
  const p=DATA.projects[i], g=p.g;
  const rank=projectOrder().findIndex(entry=>entry.i===i);
  $('sIdx').textContent=`WORK ${String(rank+1).padStart(2,'0')} / ${String(DATA.projects.length).padStart(2,'0')}`;
  $('sYear').textContent=p.year;
  $('sTag').textContent=tx(p.tag);
  $('sTitle').textContent=p.name;
  $('sJp').textContent=tx(p.summary);
  $('sDesc').textContent=tx(p.desc);
  $('sTable').innerHTML=`
    <tr><td>${t('t.status')}</td><td>${esc(tx(p.status))}</td></tr>
    <tr><td>${t('t.lang')}</td><td>${esc(projectLanguages(p).join(' / ')||'—')}</td></tr>
    <tr><td>${t('t.lic')}</td><td>${esc(g.license||'—')}</td></tr>
    <tr><td>${t('t.updated')}</td><td>${esc(updatedDisplay(g))}</td></tr>
    <tr><td>${t('t.stack')}</td><td><div class="chips">${p.stack.map(s=>`<i>${esc(s)}</i>`).join('')}</div></td></tr>
    <tr><td>${t('t.team')}</td><td>${esc(DATA.profile.github)}</td></tr>`;
  $('sMetrics').innerHTML=`
    <div class="metric"><b>${g.commits?.toLocaleString()??'—'}</b><span>${t('m.commits')}</span></div>
    <div class="metric"><b>${g.activeWeeks??'—'}</b><span>${t('m.weeks')}</span></div>
    <div class="metric"><b>${g.stars??'—'}</b><span>${t('m.stars')}</span></div>
    <div class="metric"><b>${g.forks??'—'}</b><span>${t('m.forks')}</span></div>`;
  const m=Math.max(1,...g.bars);
  $('sChart').innerHTML=g.bars.map(b=>`<i style="height:${Math.max(3,b/m*100)}%"></i>`).join('');
  const cells=[]; g.weeks.forEach(w=>(w.days||[0,0,0,0,0,0,0]).forEach(d=>cells.push(d)));
  const cm=Math.max(1,...cells);
  $('sHeat').innerHTML=cells.map(v=>`<i style="opacity:${(.08+(v/cm)*.92).toFixed(2)}"></i>`).join('');
  $('sLog').innerHTML=updatedDisplay(g)!=='—'?`<li><time>${esc(updatedDisplay(g))}</time><span><b>${esc(p.name)}</b> — ${t('ev')[0]}</span></li>`:`<li>${t('noEvents')}</li>`;
  const L=[];
  if(g.site) L.push(`<a class="slink primary" href="${esc(g.site)}" target="_blank" rel="noopener"
    aria-label="${esc(p.name+' — '+siteAction(p)+' ('+t('site.newTab')+')')}">${siteAction(p)} ↗</a>`);
  if(g.url) L.push(`<a class="slink" href="${esc(g.url)}" target="_blank" rel="noopener">${t('l.repo')}</a>`);
  if(webUrl(p.links?.docs)) L.push(`<a class="slink" href="${esc(webUrl(p.links.docs))}" target="_blank" rel="noopener">${t('l.docs')}</a>`);
  $('sLinks').innerHTML=L.join('');
}
function open(i,push=true){
  curI=i; fill(i); sheet.scrollTop=0;
  if(push&&!sheet.open)rememberPage();
  if(!sheet.open){lastFocus=document.activeElement; lockPage(); sheet.showModal()}
  sheet.classList.add('open');
  $('sClose').focus({preventScroll:true});
  if(push)history.pushState({i},'','#'+DATA.projects[i].slug);
}
function close(push=true){
  sheet.classList.remove('open'); sheet.close();
  unlockPage();
  if(lastFocus)lastFocus.focus({preventScroll:true});
  curI=-1; if(push)history.pushState({pageY:scrollY},'',location.pathname);
}
$('sClose').addEventListener('click',()=>close());
sheet.addEventListener('cancel',e=>{e.preventDefault(); close()});
sheet.addEventListener('click',e=>{if(outsideDialog(e,sheet))close()});
function outsideDialog(e,dialog){
  const r=dialog.getBoundingClientRect();
  return e.target===dialog&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom);
}
function stepProject(delta){
  let order=projectOrder().filter(({p})=>FILTER==='all'||p.filter===FILTER);
  if(!order.some(({i})=>i===curI))order=projectOrder();
  const position=order.findIndex(({i})=>i===curI);
  open(order[(position+delta+order.length)%order.length].i);
}
$('sPrev').addEventListener('click',()=>stepProject(-1));
$('sNext').addEventListener('click',()=>stepProject(1));
addEventListener('popstate',(event={})=>{
  const i=DATA.projects.findIndex(p=>p.slug===location.hash.slice(1));
  if(pal.open)palClose(i>=0);
  if(i>=0)open(i,false);
  else{
    if(sheet.classList.contains('open'))close(false);
    if(Number.isFinite(event.state?.pageY))scrollTo({top:event.state.pageY,behavior:'instant'});
    else if(['#home','#sites','#work','#about'].includes(location.hash))$(location.hash.slice(1)).scrollIntoView({behavior:'instant',block:'start'});
    else scrollTo({top:0,behavior:'instant'});
  }
});

/* ===================== events ===================== */
$('projectSort').addEventListener('change',e=>setSort(e.target.value));
$('bento').addEventListener('error',e=>{
  if(e.target.classList.contains('tile-art')) e.target.hidden=true;
},true);
document.addEventListener('click',e=>{
  const view=e.target.closest('.viewbtn');
  if(view){setView(view.dataset.view);$('projectViewControls').querySelector(`[data-view="${VIEW}"]`)?.focus({preventScroll:true});return}
  const siteFilter=e.target.closest('.site-fbtn');
  if(siteFilter){
    SITE_FILTER=siteFilter.dataset.sites; renderSites();
    $('siteTabs').querySelector(`[data-sites="${SITE_FILTER}"]`)?.focus({preventScroll:true});return;
  }
  const o=e.target.closest('.tile-open'); if(o){open(+o.dataset.i); return}
  if(e.target.closest('a[href^="#"]'))rememberPage();
  const f=e.target.closest('.fbtn');
  if(f){
    FILTER=f.dataset.k; renderTiles();
    return;
  }
  const l=e.target.closest('.lang button');
  if(l){LANG=l.dataset.lang; try{localStorage.setItem('lang',LANG)}catch(err){} render()}
});

/* palette */
const pal=$('pal'), palin=$('palin'), palres=$('palres');
let psel=0, plist=[];
function palDraw(){
  const q=palin.value.trim().toLowerCase();
  plist=projectOrder().map(({i})=>i).filter(i=>{
    const p=DATA.projects[i];
    return (p.name+tx(p.summary)+p.stack.join()+projectLanguages(p).join()+tx(p.tag)).toLowerCase().includes(q);
  });
  if(psel>=plist.length)psel=Math.max(plist.length-1,0);
  palres.innerHTML=plist.length?plist.map((i,k)=>{
    const p=DATA.projects[i];
    return `<button class="pi ${k===psel?'on':''}" data-i="${i}">
      <span class="pn">${esc(p.name)}</span><span class="pj">${esc(tx(p.summary))}</span>
      <span class="ps">${esc(tx(p.status))}</span></button>`}).join('')
    :`<div class="empty">${t('empty')}</div>`;
}
function palOpen(){if(!pal.open){lockPage();pal.showModal()} pal.classList.add('open');
  palin.value=''; psel=0; palDraw(); palin.focus()}
function palClose(keepLocked=false){pal.classList.remove('open'); pal.close();
  if(!keepLocked)unlockPage()}
function selectResult(i){palClose(true);open(i)}
$('palbtn').addEventListener('click',palOpen);
$('palClose').addEventListener('click',()=>palClose());
palin.addEventListener('input',()=>{psel=0;palDraw()});
palres.addEventListener('click',e=>{const b=e.target.closest('.pi'); if(!b)return; selectResult(+b.dataset.i)});
palin.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==='ArrowDown'){e.preventDefault();psel=Math.min(psel+1,plist.length-1);palDraw()}
  if(e.key==='ArrowUp'){e.preventDefault();psel=Math.max(psel-1,0);palDraw()}
  if(e.key==='Enter'&&plist.length){e.preventDefault();selectResult(plist[psel])}
});
pal.addEventListener('click',e=>{if(outsideDialog(e,pal))palClose()});
pal.addEventListener('cancel',e=>{e.preventDefault(); palClose()});
addEventListener('keydown',e=>{
  if(e.key==='Tab'){
    const dialog=pal.open?pal:sheet.open?sheet:null;
    if(dialog){
      const controls=[...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled])')]
        .filter(el=>el.getClientRects().length);
      const first=controls[0],last=controls.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
    }
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();return}
  if(sheet.classList.contains('open')&&!pal.classList.contains('open')){
    if(e.key==='ArrowRight')stepProject(1);
    if(e.key==='ArrowLeft')stepProject(-1);
  }
});

/* ===================== motion ===================== */
function startMotion(){
  const sizeNav=()=>document.documentElement.style.setProperty('--nav-height',`${$('siteNav').getBoundingClientRect().height}px`);
  new ResizeObserver(sizeNav).observe($('siteNav')); sizeNav();
  const sizeSearch=()=>{
    pal.style.setProperty('--visual-height',`${visualViewport.height}px`);
    pal.style.setProperty('--visual-top',`${visualViewport.offsetTop}px`);
  };
  if(window.visualViewport){
    visualViewport.addEventListener('resize',sizeSearch);
    visualViewport.addEventListener('scroll',sizeSearch); sizeSearch();
  }
  const i=DATA.projects.findIndex(p=>p.slug===location.hash.slice(1));
  if(i>=0)open(i,false);

  new IntersectionObserver(es=>es.forEach(en=>{
    document.body.classList.toggle('light',en.isIntersecting);
  }),{threshold:.42}).observe($('about'));


}

boot();
</script>
